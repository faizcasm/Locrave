<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <!-- Primary Meta Tags -->
    <meta name="description" content="Locrave - Your local community, connected. Find services, buy & sell locally, and connect with neighbors." />
    <meta name="keywords" content="local community, neighborhood app, local services, buy sell locally, community connection, hyper-local" />
    <meta name="author" content="Locrave Team" />
    <meta name="theme-color" content="#4DB6AC" />
    
    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://locrave.com/" />
    <meta property="og:title" content="Locrave - Your Local Community App" />
    <meta property="og:description" content="Your local community, connected. Find services, buy & sell locally, and connect with neighbors." />
    <meta property="og:image" content="https://locrave.com/og-image.png" />
    <meta property="og:site_name" content="Locrave" />
    
    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:url" content="https://locrave.com/" />
    <meta property="twitter:title" content="Locrave - Your Local Community App" />
    <meta property="twitter:description" content="Your local community, connected. Find services, buy & sell locally, and connect with neighbors." />
    <meta property="twitter:image" content="https://locrave.com/og-image.png" />
    
    <!-- SEO -->
    <link rel="canonical" href="https://locrave.com/" />
    <meta name="robots" content="index, follow" />
    
    <title>Locrave - Your Local Community App</title>
    
    <!-- Preconnect to external resources -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    
    <!-- Preload critical fonts -->
    <link rel="preload" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" as="style">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- DNS Prefetch -->
    <link rel="dns-prefetch" href="https://fonts.googleapis.com">
    <link rel="dns-prefetch" href="https://fonts.gstatic.com">
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
